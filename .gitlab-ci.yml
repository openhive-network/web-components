stages:
  - .pre
  - build
  - deploy

variables:
  GIT_DEPTH: 1
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive

# Branch pipelines (what the Workflows/Branch-Pipelines template did), except for
# AIDEV-driven development: ai/<issue>-..., session/<name> and aidev/integration
# are verified by the suites in .aidev/project.yaml, not by CI. A push to
# aidev/integration runs no pipeline; one started by hand or through the API does
# (`glab ci run -b aidev/integration`), which is how its MR into develop gets the
# pipeline develop's merge rule requires.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(ai|session)\//
      when: never
    - if: $CI_COMMIT_BRANCH == "aidev/integration" && $CI_PIPELINE_SOURCE !~ /^(web|api)$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

include:
  - project: "hive/common-ci-configuration"
    ref: ab4d4c78df8ebc5b5d7744fe2cfa64c51143fe01
    file:
      - "/templates/npm_projects.gitlab-ci.yml"

default:
  tags:
    - public-runner-docker

lint:
  stage: .pre
  extends: .npm_based_job_base
  script:
    - pnpm lint:ci
    - pnpm format:ci

build:
  stage: build
  extends: .npm_based_job_base
  variables:
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "components"
    NPM_REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
  needs:
    - job: lint
  script:
    - /home/emscripten/scripts/npm_generate_version.sh "${CI_PROJECT_DIR}" "${NPM_REGISTRY_URL}" "${NPM_PACKAGE_SCOPE}" "${NPM_PACKAGE_NAME}" "${CI_COMMIT_REF_PROTECTED}" "${CI_COMMIT_TAG}"
    - pnpm build
  artifacts:
    reports:
      dotenv:
        - "built_package_version_info.env" # contains information related to generated package version and git revision
    paths:
      - "dist"
      - "package.json"
      - "packages/*/dist"
    when: always
    expire_in: 1 week

deploy_dev_package:
  stage: deploy
  extends: .npm_deploy_package_template
  variables:
    NPM_PACKAGE_SCOPE: "@hiveio"
  needs:
    - job: build
      artifacts: true
  before_script: # Override to skip processing nonexistent tarball file
    - !reference [.npm_based_job_base, before_script]

deploy_production_public_npm:
  stage: deploy
  extends: .registry_npmjs_org_deploy_package_template
  variables:
    NPM_PUBLISH_TOKEN: "$INTERNAL_HIDDEN_PUBLISH_TOKEN"
    NPM_PACKAGE_NAME: "components"
  needs:
    - job: deploy_dev_package
    - job: build
      artifacts: true
  before_script: # Override to skip processing nonexistent tarball file
    - !reference [.npm_based_job_base, before_script]
