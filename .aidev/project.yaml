# Profile for hive/web-components, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: web-components

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/web-components"
  id: 532

# A single-branch topology: this is both what work integrates into and what
# ships. `stable` is omitted rather than declared equal to it — declaring
# them equal is a typo, omitting one is a topology. Add `stable:` when this
# project genuinely promotes to a second branch.
# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/denser), so `stable` is omitted and `aidev release`
# never moves develop or main.
branches:
  integration: "aidev/integration"
  # develop is protected and fast-forward only: hand off by merge request, as a
  # linear one-commit-per-change copy (aidev docs/operations/project-handoff.md).
  handoff: "develop"
  handoff_history: "linear"

# How this project's suites execute (#13892): one kind, stated once.
# `shared` (aidev docs/operations/shared-test-images.md): ccc's node-test-tools at
# the moving `develop` tag, which aidev pins to one digest per workflow, with a
# host pnpm store filled by `fetch` and mounted read-only at `store`. `fallback`
# is the image .aidev/runtime/ builds, its store at the same path; see
# .aidev/README.md.
environment:
  kind: shared
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/node-test-tools:develop
  packages:
    lock: pnpm-lock.yaml
    store: /opt/pnpm-store
    fetch: [pnpm, fetch, --frozen-lockfile, --store-dir, /opt/pnpm-store]
    install: [pnpm, install, --offline, --frozen-lockfile, --store-dir, /opt/pnpm-store]
  fallback: registry.gitlab.syncad.com/hive/web-components/aidev-tests@sha256:8211c42604e89f0e0be63ee8e0633990c95899f2185718e6a546d1910a750251

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "lint", "format", "build", "typecheck"]
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "lint", "format", "build", "typecheck"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "build"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "lint", "format", "build", "typecheck"]
    artifacts: ["test-results/canary/"]
  static:
    adapter: command
    args: [".aidev/run-checks.sh", "static", "lint", "format", "typecheck"]
    artifacts: ["test-results/static/"]
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "build"]
    artifacts: ["test-results/coverage/"]
  system:
    adapter: command
    args: [".aidev/run-checks.sh", "system", "build"]
    artifacts: ["test-results/system/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
